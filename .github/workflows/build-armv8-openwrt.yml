name: build armv8 openwrt

on:
  #自动编译：每个月15/28早上4点
  #  schedule:
  #    - cron: 0 16 15,28 * *
  workflow_call:
    inputs:
      source:
        description: '选择要编译的源码版本，可选：lede, immortalwrt'
        required: true
        default: 'lede'
        type: string
  workflow_dispatch:
    inputs:
      source:
        description: '选择要编译的LUCI版本'
        required: true
        default: 'lede'
        type: choice
        options: ['lede', 'immortalwrt']
      ip:
        description: '设置默认登录IP'
        required: false
        default: '192.168.2.254'
      toolchain:
        description: '使用toolchain缓存'
        required: false
        default: true
        type: boolean
      zsh_tool:
        description: '预设zsh终端工具'
        required: false
        default: true
        type: boolean
      openwrt_board:
        description: '设置设备(CPU)型号'
        required: false
        default: 's905d'
      openwrt_kernel:
        description: "选择模糊内核版本，和输入的是2选一，取最新"
        required: true
        default: "6.1.y_6.6.y_6.12.y_6.18.y"
        type: choice
        options:
          - 5.4.y
          - 5.10.y
          - 5.15.y
          - 6.1.y
          - 6.6.y
          - 6.12.y
          - 6.18.y
          - 5.4.y_5.10.y_5.15.y
          - 5.15.y_6.1.y
          - 6.1.y_6.6.y_6.12.y_6.18.y
      input_kernel:
        description: '输入具体内核版本，和选择的是2选一'
        required: false
        default: '6.6.116'
        type: string
      auto_kernel:
        description: "Auto use the latest kernel"
        required: false
        default: true
        type: boolean
      kernel_repo:
        description: "Set the kernel repository"
        required: true
        default: "ophub/kernel"
        type: choice
        options:
          - ophub/kernel
          - laiyujun/kernel
      kernel_usage:
        description: "Set the tags of the stable kernel."
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - flippy
      artifact:
        description: '上传固件到Artifact'
        required: false
        default: false
        type: boolean
      release:
        description: '上传固件到Releases'
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-24.04
    name: build armv8 ${{ inputs.source || 'lede' }}

    env:
      DEFAULT_IP: ${{ inputs.ip || '192.168.2.254' }}
      TOOLCHAIN: ${{ inputs.toolchain || true }}
      ZSH_TOOL: ${{ inputs.zsh_tool || true }}
      OPENWRT_BOARD: ${{ inputs.openwrt_board || 's905d' }}
      OPENWRT_KERNEL: ${{ inputs.openwrt_kernel || '6.1.y_6.6.y_6.12.y_6.18.y' }}
      AUTO_KERNEL: ${{ inputs.auto_kernel || true }}
      INPUT_KERNEL: ${{ inputs.input_kernel || '6.6.116' }}
      KERNEL_REPO: ${{ inputs.kernel_repo || 'ophub/kernel' }}
      KERNEL_USAGE: ${{ inputs.kernel_usage || 'stable' }}
      CONFIG_FILE: configs/armv8-${{ inputs.source || 'lede' }}.config
      APP_CONFIG_FILE: configs/app.config
      DIY_SCRIPT: diy-${{ inputs.source || 'lede' }}.sh
      RELEASE_TAG: armv8-${{ inputs.source || 'lede' }}
      TOOLCHAIN_TAG: toolchain-cache
      UPLOAD_BIN_DIR: false
      UPLOAD_TO_ARTIFACT: ${{ inputs.artifact || false }}
      UPLOAD_TO_RELEASE: ${{ inputs.release || true }}
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - run: date   # 已经显示 CST

      - name: Check Server Performance
        run: |
          echo "警告⚠"
          echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          echo -e "已知CPU型号(降序): 7763，8370C，8272CL，8171M，E5-2673\n"
          echo "==========================CPU信息=========================="
          echo "CPU物理数量: $(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
          echo "CPU线程数量: $(nproc)"
          echo -e "CPU型号信息:$(cat /proc/cpuinfo | grep -m1 name | awk -F: '{print $2}')\n"
          echo "==========================内存信息=========================="
          echo "已安装内存详细信息:"
          echo -e "$(sudo lshw -short -C memory | grep GiB)\n"
          echo "==========================硬盘信息=========================="
          echo "硬盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -y update
          sudo -E apt -y install dos2unix rename $(curl -fsSL https://ophub.org/ubuntu2404-make-openwrt-depends)
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E systemctl daemon-reload
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Combine Disks
        run: |
          if mountpoint -q /mnt; then
            mnt_size=$(($(df -k --output=avail /mnt | tail -1) / 1024 - 1024))
            sudo truncate -s ${mnt_size}M /mnt/mnt.img
            loop_mnt=$(sudo losetup -f --show /mnt/mnt.img)
          fi
          root_size=$(($(df -k --output=avail / | tail -1) / 1024 - 4096))
          sudo truncate -s ${root_size}M /root.img
          loop_root=$(sudo losetup -f --show /root.img)
          sudo pvcreate -f $loop_mnt $loop_root
          sudo vgcreate github $loop_mnt $loop_root
          sudo lvcreate -n runner -l 100%FREE github
          sudo mkfs.btrfs -f /dev/github/runner
          sudo mkdir -p /workdir
          sudo mount -o compress=zstd /dev/github/runner /workdir
          sudo chown -R runner:runner /workdir && df -hT

      - name: Load Compile Script
        run: chmod +x $DIY_SCRIPT && ./$DIY_SCRIPT

      - name: Compile Toolchain
        if: env.REBUILD_TOOLCHAIN == 'true'
        id: toolchain
        run: |
          cd $OPENWRT_PATH
          make toolchain/compile -j$(nproc) || make toolchain/compile -j1 V=s
          $GITHUB_WORKSPACE/$DIY_SCRIPT

      - name: Delete Old Toolchain
        if: steps.toolchain.conclusion == 'success' || env.OUTPUT_RELEASE == 'true'
        uses: mknejp/delete-release-assets@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ env.TOOLCHAIN_TAG }}
          assets: |
            ${{ env.SOURCE_REPO }}-${{ env.LITE_BRANCH }}-${{ env.DEVICE_TARGET }}-cache*
          fail-if-no-assets: false
          fail-if-no-release: false

      - name: Upload Toolchain To Release
        if: steps.toolchain.conclusion == 'success' || env.OUTPUT_RELEASE == 'true'
        uses: softprops/action-gh-release@master
        with:
          name: toolchain-cache
          tag_name: ${{ env.TOOLCHAIN_TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: output/*
          body: OpenWrt 工具链缓存

      - name: Download DL Package
        run: |
          cd $OPENWRT_PATH
          # make download -j$(nproc)
          make package/download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        id: compile
        run: |
          cd $OPENWRT_PATH
          mkdir -p files/etc/uci-defaults
          cp $GITHUB_WORKSPACE/scripts/init-settings.sh files/etc/uci-defaults/99-init-settings
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
          echo "FILE_DATE=$(date +"%Y.%m.%d")" >>$GITHUB_ENV
          echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >>$GITHUB_ENV

      - name: Upload Bin Directory
        if: steps.compile.conclusion == 'success' && env.UPLOAD_BIN_DIR == 'true'
        uses: actions/upload-artifact@main
        with:
          name: ${{ env.SOURCE_REPO }}-${{ env.LITE_BRANCH }}-${{ env.DEVICE_TARGET }}-bin-${{ env.FILE_DATE }}
          path: ${{ env.OPENWRT_PATH }}/bin

      - name: Debug before packaging
        run: |
          echo "=== OpenWrt target tree ==="
          ls -lhR openwrt/bin/targets
          echo "=== Rootfs search ==="
          find ${{ env.OPENWRT_PATH }}/bin/targets -name "*rootfs.tar.gz"
          echo "=== Rootfs targz delete ==="
          rm -f ${{ env.OPENWRT_PATH }}/bin/targets/*/*/*targz-rootfs.tar.gz
          find ${{ env.OPENWRT_PATH }}/bin/targets -name "*rootfs.tar.gz"

      - name: Packaging OpenWrt For Auto Kernel
        if: steps.compile.conclusion == 'success' && env.AUTO_KERNEL == 'true'
        uses: haiibo/flippy-openwrt-actions@main
        env:
          OPENWRT_ARMSR: ${{ env.OPENWRT_PATH }}/bin/targets/*/*/*rootfs.tar.gz
          PACKAGE_SOC: ${{ env.OPENWRT_BOARD }}
          KERNEL_REPO_URL: ${{ env.KERNEL_REPO }}
          KERNEL_VERSION_NAME: ${{ env.OPENWRT_KERNEL }}
          KERNEL_AUTO_LATEST: ${{ env.AUTO_KERNEL }}

      - name: Packaging OpenWrt For Input Kernel
        if: steps.compile.conclusion == 'success' && env.AUTO_KERNEL == 'false'
        uses: haiibo/flippy-openwrt-actions@main
        env:
          OPENWRT_ARMSR: ${{ env.OPENWRT_PATH }}/bin/targets/*/*/*rootfs.tar.gz
          PACKAGE_SOC: ${{ env.OPENWRT_BOARD }}
          KERNEL_REPO_URL: ${{ env.KERNEL_REPO }}
          KERNEL_VERSION_NAME: ${{ env.INPUT_KERNEL }}
          KERNEL_AUTO_LATEST: ${{ env.AUTO_KERNEL }}

      - name: Organize Files
        if: env.PACKAGED_STATUS == 'success'
        run: |
          df -h && cd $OPENWRT_PATH
          du -h --max-depth=1
          echo "==============================="
          cd $OPENWRT_PATH/bin/targets/*/* && ls
          echo "==============================="          
          cat config.buildinfo
          cp -rf $OPENWRT_PATH/bin/packages/* packages
          tar -zcf packages.tar.gz packages
          sleep 3s && rm -rf packages u-boot-qemu* sha256sums *.buildinfo *.manifest *.bin
          sed '/^$/d' $OPENWRT_PATH/.config >config.txt
          echo "FIRMWARE_PATH=$PWD" >>$GITHUB_ENV
          cd $PACKAGED_OUTPUTPATH && rm -f *rootfs.tar.gz *.sha
          if [[ $SOURCE_REPO == 'immortalwrt' ]]; then
            rename 's/openwrt/${{ env.SOURCE_REPO }}/' *
          fi

      - name: Upload OpenWrt To Artifact
        if: env.PACKAGED_STATUS == 'success' && env.UPLOAD_TO_ARTIFACT == 'true'
        uses: actions/upload-artifact@main
        with:
          name: ${{ env.SOURCE_REPO }}-${{ env.LITE_BRANCH }}-${{ env.DEVICE_TARGET }}-firmware-${{ env.FILE_DATE }}
          path: ${{ env.PACKAGED_OUTPUTPATH }}
          overwrite: true

      - name: Upload OpenWrt To Release
        if: env.PACKAGED_STATUS == 'success' && env.UPLOAD_TO_RELEASE == 'true'
        uses: ncipollo/release-action@main
        with:
          name: ${{ env.DATE }} for ${{ env.DEVICE_TARGET }}
          allowUpdates: true
          removeArtifacts: true
          tag: ${{ env.RELEASE_TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ env.FIRMWARE_PATH }}/*,${{ env.PACKAGED_OUTPUTPATH }}/*
          body: |
            **This is ${{ env.SOURCE_REPO }} firmware for ${{ env.DEVICE_TARGET }}**
            ### 📒 固件信息
            - 💻 平台架构: ${{ env.DEVICE_TARGET }}
            - ⚽ 固件源码: ${{ env.REPO_URL }}
            - 💝 源码分支: ${{ env.REPO_BRANCH }}
            - 🚀 内核版本: ${{ env.KERNEL_VERSION }}
            - 🌐 默认地址: ${{ env.DEFAULT_IP }}
            - 🔑 默认密码: password
            ### 🧊 固件版本
            - 固件编译前最后一次➦[主源码](${{ env.REPO_URL }})更新记录
            - ${{ env.COMMIT_AUTHOR }}
            - ${{ env.COMMIT_DATE }}
            - ${{ env.COMMIT_MESSAGE }}
            - ${{ env.COMMIT_HASH }}
