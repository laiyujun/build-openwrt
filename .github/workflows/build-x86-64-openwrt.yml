name: build x86/64 openwrt

on:
  #自动编译：每个星期五早上4点
  #  schedule:
  #    - cron: 0 16 * * 5
  workflow_call:
    inputs:
      source:
        description: '选择要编译的源码版本，可选：lede, immortalwrt'
        required: true
        default: 'lede'
        type: string
      partsize:
        description: '设置rootfs大小'
        required: false
        default: 2048
        type: number
  workflow_dispatch:
    inputs:
      source:
        description: '选择要编译的LUCI版本'
        required: true
        default: 'lede'
        type: choice
        options: ['lede', 'immortalwrt']
      target:
        description: '选择要编译的机型'
        required: true
        default: 'x86-64'
        type: choice
        options: [x86-64]
      ip:
        description: '设置默认登录IP'
        required: false
        default: '192.168.2.8'
      partsize:
        description: '设置rootfs大小'
        required: false
        default: 2048
      toolchain:
        description: '使用toolchain缓存'
        required: false
        default: true
        type: boolean
      zsh_tool:
        description: '预设zsh终端工具'
        required: false
        default: true
        type: boolean
      artifact:
        description: '上传固件到Artifact'
        required: false
        default: false
        type: boolean
      release:
        description: '上传固件到Releases'
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-24.04
    name: build x86-64 ${{ inputs.source || 'lede' }}

    env:
      DEFAULT_IP: ${{ inputs.ip || '192.168.2.8'  }}
      PART_SIZE: ${{ inputs.partsize || '2048' }}
      TOOLCHAIN: ${{ inputs.toolchain || true }}
      ZSH_TOOL: ${{ inputs.zsh_tool || true }}
      CONFIG_FILE: configs/${{ inputs.target || 'x86-64' }}-${{ inputs.source || 'lede' }}.config
      APP_CONFIG_FILE: configs/app.config
      DIY_SCRIPT: diy-${{ inputs.source || 'lede' }}.sh
      RELEASE_TAG: ${{ inputs.target || 'x86-64' }}-${{ inputs.source || 'lede' }}
      TOOLCHAIN_TAG: toolchain-cache
      UPLOAD_BIN_DIR: false
      UPLOAD_TO_ARTIFACT: ${{ inputs.artifact || false }}
      UPLOAD_TO_RELEASE: ${{ inputs.release || true }}
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Check Server Performance
        run: |
          echo "警告⚠"
          echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          echo -e "已知CPU型号(降序): 7763，8370C，8272CL，8171M，E5-2673\n"
          echo "==========================CPU信息=========================="
          echo "CPU物理数量: $(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
          echo "CPU线程数量: $(nproc)"
          echo -e "CPU型号信息:$(cat /proc/cpuinfo | grep -m1 name | awk -F: '{print $2}')\n"
          echo "==========================内存信息=========================="
          echo "已安装内存详细信息:"
          echo -e "$(sudo lshw -short -C memory | grep GiB)\n"
          echo "==========================硬盘信息=========================="
          echo "硬盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install dos2unix
          sudo -E apt-get -y install $(curl -fsSL ophub.org/ubuntu2404-make-openwrt-depends)
          sudo -E systemctl daemon-reload
          date -u
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Combine Disks
        run: |
          if mountpoint -q /mnt; then
            mnt_size=$(($(df -k --output=avail /mnt | tail -1) / 1024 - 1024))
            sudo truncate -s ${mnt_size}M /mnt/mnt.img
            loop_mnt=$(sudo losetup -f --show /mnt/mnt.img)
          fi
          root_size=$(($(df -k --output=avail / | tail -1) / 1024 - 4096))
          sudo truncate -s ${root_size}M /root.img
          loop_root=$(sudo losetup -f --show /root.img)
          sudo pvcreate -f $loop_mnt $loop_root
          sudo vgcreate github $loop_mnt $loop_root
          sudo lvcreate -n runner -l 100%FREE github
          sudo mkfs.btrfs -f /dev/github/runner
          sudo mkdir -p /workdir
          sudo mount -o compress=zstd /dev/github/runner /workdir
          sudo chown -R runner:runner /workdir && df -hT

      - name: Load Compile Script
        run: chmod +x $DIY_SCRIPT && ./$DIY_SCRIPT

      - name: Compile Toolchain
        if: env.REBUILD_TOOLCHAIN == 'true'
        id: toolchain
        run: |
          cd $OPENWRT_PATH
          make toolchain/compile -j$(nproc) || make toolchain/compile -j1 V=s
          $GITHUB_WORKSPACE/$DIY_SCRIPT

      - name: Delete Old Toolchain
        if: steps.toolchain.conclusion == 'success' || env.OUTPUT_RELEASE == 'true'
        uses: mknejp/delete-release-assets@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ env.TOOLCHAIN_TAG }}
          assets: '${{ env.SOURCE_REPO }}-${{ env.LITE_BRANCH }}-${{ env.DEVICE_TARGET }}*'
          fail-if-no-assets: false
          fail-if-no-release: false

      - name: Upload Toolchain To Release
        if: steps.toolchain.conclusion == 'success' || env.OUTPUT_RELEASE == 'true'
        uses: softprops/action-gh-release@master
        with:
          name: toolchain-cache
          tag_name: ${{ env.TOOLCHAIN_TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: output/*
          body: OpenWrt 工具链缓存

      - name: Download DL Package
        run: |
          cd $OPENWRT_PATH
          # make download -j$(nproc)
          make package/download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        id: compile
        run: |
          cd $OPENWRT_PATH
          mkdir -p files/etc/uci-defaults
          cp $GITHUB_WORKSPACE/scripts/init-settings.sh files/etc/uci-defaults/99-init-settings
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
          echo "FILE_DATE=$(date +"%Y.%m.%d")" >>$GITHUB_ENV
          echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >>$GITHUB_ENV

      - name: Upload Bin Directory
        if: steps.compile.conclusion == 'success' && env.UPLOAD_BIN_DIR == 'true'
        uses: actions/upload-artifact@main
        with:
          name: ${{ env.SOURCE_REPO }}-${{ env.LITE_BRANCH }}-${{ env.DEVICE_TARGET }}-bin-${{ env.FILE_DATE }}
          path: ${{ env.OPENWRT_PATH }}/bin

      - name: Organize Files
        if: steps.compile.conclusion == 'success'
        run: |
          df -h && cd $OPENWRT_PATH
          du -h --max-depth=1
          echo "==============================="
          cd $OPENWRT_PATH/bin/targets/*/* && ls
          echo "==============================="
          cat config.buildinfo
          cp -rf $OPENWRT_PATH/bin/packages/* packages
          tar -zcf packages.tar.gz packages
          sleep 3s && rm -rf packages sha256sums *.buildinfo *.bin *.json *rootfs.img.gz
          sed '/^$/d' $OPENWRT_PATH/.config >config.txt
          echo "FIRMWARE_PATH=$PWD" >>$GITHUB_ENV

      - name: Upload Firmware To Artifact
        if: steps.compile.conclusion == 'success' && env.UPLOAD_TO_ARTIFACT == 'true'
        uses: actions/upload-artifact@main
        with:
          name: ${{ env.SOURCE_REPO }}-${{ env.LITE_BRANCH }}-${{ env.DEVICE_TARGET }}-firmware-${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE_PATH }}
          overwrite: true

      - name: Upload Firmware To Release
        if: steps.compile.conclusion == 'success' && env.UPLOAD_TO_RELEASE == 'true'
        uses: ncipollo/release-action@main
        with:
          name: ${{ env.DATE }} for ${{ env.DEVICE_TARGET }}
          allowUpdates: true
          removeArtifacts: true
          tag: ${{ env.RELEASE_TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ env.FIRMWARE_PATH }}/*
          body: |
            **This is ${{ env.SOURCE_REPO }} firmware for ${{ env.DEVICE_TARGET }}**
            ### 📒 固件信息
            - 💻 平台架构: ${{ env.DEVICE_TARGET }}
            - ⚽ 固件源码: ${{ env.REPO_URL }}
            - 💝 源码分支: ${{ env.REPO_BRANCH }}
            - 🚀 内核版本: ${{ env.KERNEL_VERSION }}
            - 🌐 默认地址: ${{ env.DEFAULT_IP }}
            - 🔑 默认密码: password
            ### 🧊 固件版本
            - 固件编译前最后一次➦[主源码](${{ env.REPO_URL }})更新记录
            - ${{ env.COMMIT_AUTHOR }}
            - ${{ env.COMMIT_DATE }}
            - ${{ env.COMMIT_MESSAGE }}
            - ${{ env.COMMIT_HASH }}
